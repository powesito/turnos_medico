{% extends 'citas/base.html' %}
{% block title %}Registro · Turnos Médicos{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Crear cuenta</h1>
        <form method="post" class="card card-body shadow-sm">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Registrarme</button>
        </form>
        <p class="text-center mt-3">¿Ya tienes cuenta? <a href="{% url 'citas:login' %}">Inicia sesión</a></p>
    </div>
</div>
{% endblock %}
